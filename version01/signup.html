<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up</title>
    <link rel="stylesheet" href="styles/styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Belanosima:wght@400;600;700&family=Crete+Round:ital@0;1&family=Jost:ital,wght@0,100..900;1,100..900&family=Keania+One&display=swap"
        rel="stylesheet">
    <script src="https://kit.fontawesome.com/f9868e7eb8.js" crossorigin="anonymous"></script>
    <script defer src="scripts/script/js"></script>
</head>
<body>
    <!--Main Content -->
    <main>
        <!-- Main -->
        <!--header -->
        <header class="header">
<nav class="nav">
    <div class="nav1">
        <a class="logo" href="index.html">The Home Workshop</a>
      </div>
        </nav>

        </header>

<div class="sign-up">
<form action="" class="sign-box">
    <legend>Sign Up</legend>
    <label for="user-name">User name</label>
    <input type="text" name="user-name" id="user-name" required placeholder="User Name">

    <label for="email">Email</label>
    <input type="email" name="email" id="email" placeholder="email.address@email.com">

    <label for="password">Password</label>
    <input type="password" name="password" id="password" placeholder="Password">
    <div class="form-experience">
        <div>
            <input type="checkbox" id="renter" value="renter">
            <label for="renter">Renter</label>
        </div>
        <div>
            <input type="checkbox" id="homeowner" value="homeowner">
            <label for="homeowner">Homeowner</label>
        </div>
        <div>
            <input type="checkbox" id="flipper" value="flipper">
            <label for="flipper">House Flipper</label>
        </div>
        <div>
            <input type="checkbox" id="expert" value="expert">
            <label for="expert">Contractor</label>
        </div>
</div>
    <input class="sign-button" type="submit" value="Submit">
    <div>
        <p class="center">Already have an account? <strong><a class="link" href="signin.html">Sign In</a></strong></p>
    </div>
</form>

<img class="imagefw fade" src="images/plant-room.jpg" alt="">

</div>
<!-- form
user name
password
types of user: homeowner, house flipper, expert
button
-->
</body>
</html>
